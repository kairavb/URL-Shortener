<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(45deg, #d598ed, #7f11ad);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 1rem;
        }

        form {
            width: min(600px, 90%);
            margin: 2rem 0;
        }

        input {
            padding: 15px;
            width: 100%;
            box-sizing: border-box;
            border-radius: 8px;
            border: 2px solid #fff;
            background: transparent;
            color: white;
            font-size: 1rem;
            margin-bottom: 1rem;
        }

        button {
            padding: 12px 30px;
            background-color: #d598ed;
            color: white;
            border: none;
            border-radius: 25px;
            font-size: 1rem;
            cursor: pointer;
        }

        button:hover {
            background-color: #7f11ad;
        }

        #result {
            font-size: 1.2rem;
            min-height: 1.5rem;
        }

        a {
            color: #fff;
        }
    </style>
</head>
<body>
    <h1>URL Shortener</h1>

    <form id="form">
        <input type="url" id="url" placeholder="Enter long URL..." required>
        <button type="submit">Shorten</button>
    </form>

    <p id="result"></p>

    <script>
        const form = document.getElementById("form");
        const result = document.getElementById("result");

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            result.textContent = "Shortening...";

            const response = await fetch("/shorten", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ url: document.getElementById("url").value }),
            });

            if (!response.ok) {
                result.textContent = "Could not shorten that URL.";
                return;
            }

            const data = await response.json();
            result.innerHTML = `Short URL: <a href="${data.short_url}" target="_blank">${data.short_url}</a>`;
        });
    </script>
</body>
</html>
